<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamApp Mobile - Temporadas Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-black: #000000;
            --bg-card: #16161a;
            --bg-pill: #1f1f24;
            --accent-red: #e50914;
            --text-white: #ffffff;
            --text-gray: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            padding-bottom: 110px;
            overflow-x: hidden;
        }

        /* --- COMPONENTE BUSCADOR GLOBAL --- */
        .search-container-box {
            padding: 0 16px;
            margin-top: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .search-container-box.show {
            display: block;
        }
        .search-input-wrapper {
            display: flex;
            background-color: var(--bg-pill);
            padding: 12px 16px;
            border-radius: 14px;
            align-items: center;
            gap: 10px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .search-input-wrapper:focus-within {
            border-color: var(--accent-red);
        }
        .search-input-wrapper input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            font-size: 1rem;
            outline: none;
        }
        .clear-search-btn {
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
        }

        /* --- VISTAS / PANTALLAS --- */
        .page-view {
            display: none;
        }
        .page-view.active-view {
            display: block;
        }

        /* --- BARRA SUPERIOR --- */
        .top-request-bar {
            background: linear-gradient(90deg, #2c0d0d 0%, #16161a 100%);
            margin: 12px 16px;
            padding: 14px 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border-left: 3px solid var(--accent-red);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        /* --- PÍLDORAS DE ACCESO RÁPIDO --- */
        .quick-actions {
            display: flex;
            gap: 10px;
            padding: 0 16px;
            margin-bottom: 20px;
            align-items: center;
        }

        .pill-btn {
            background-color: var(--bg-pill);
            color: var(--text-white);
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pill-btn.active-pill {
            background-color: var(--accent-red);
        }

        .search-icon-btn {
            background-color: var(--bg-pill);
            color: var(--text-white);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-left: auto;
            cursor: pointer;
        }

        /* --- HERO BANNER --- */
        .hero-container {
            padding: 0 16px;
            margin-bottom: 28px;
        }
        .hero-card {
            position: relative;
            height: 230px;
            border-radius: 24px;
            overflow: hidden;
            background-size: cover;
            background-position: center 30%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            cursor: pointer;
            transition: background-image 0.6s ease-in-out;
        }
        
        .hero-card h1, .hero-card .hero-meta {
            animation: fadeInText 0.6s ease-in-out;
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge-movie {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: var(--accent-red);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .hero-card h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
        .hero-meta { display: flex; gap: 8px; font-size: 0.8rem; color: var(--text-gray); }

        .slider-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
        .dot { width: 6px; height: 6px; background-color: #3f3f46; border-radius: 50%; cursor: pointer; transition: all 0.3s; }
        .dot.active { width: 24px; background-color: var(--accent-red); border-radius: 4px; }

        /* --- SECCIONES DE VIDEOS --- */
        .section-container { margin-bottom: 28px; }
        .section-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            margin-bottom: 14px;
        }
        .section-title-bar h2 { font-size: 1.15rem; font-weight: 700; }
        .btn-view-more {
            background-color: var(--bg-pill);
            color: var(--text-white);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .horizontal-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 0 16px;
        }
        .horizontal-scroll::-webkit-scrollbar { display: none; }

        /* --- TARJETAS --- */
        .movie-poster-card { flex: 0 0 140px; position: relative; }
        .poster-wrapper {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            background-color: var(--bg-card);
            cursor: pointer;
        }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .fav-toast-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            z-index: 5;
        }
        .fav-toast-btn.is-fav { color: var(--accent-red); }

        /* --- ESTILO TOP 10 CARD --- */
        .top10-card {
            flex: 0 0 165px;
            position: relative;
            display: flex;
            align-items: flex-end;
            height: 190px;
            margin-left: 15px;
        }
        .top10-number {
            font-size: 7.5rem;
            font-weight: 900;
            line-height: 1;
            position: absolute;
            left: -20px;
            bottom: -15px;
            z-index: 2;
            color: #000;
            text-shadow: 2px 2px 0px var(--accent-red), -2px -2px 0px var(--accent-red), 2px -2px 0px var(--accent-red), -2px 2px 0px var(--accent-red);
            user-select: none;
        }
        .top10-poster {
            width: 120px;
            height: 170px;
            border-radius: 12px;
            overflow: hidden;
            z-index: 3;
            margin-left: auto;
            background-color: var(--bg-card);
            cursor: pointer;
            position: relative;
        }
        .top10-poster img { width: 100%; height: 100%; object-fit: cover; }

        /* --- VISTA DE REPRODUCTOR AVANZADO --- */
        .player-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-black);
            z-index: 2000;
            display: none;
            flex-direction: column;
        }
        .player-modal.open { display: flex; }
        .player-header {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            background-color: #0c0c0e;
        }
        .player-header i { cursor: pointer; font-size: 1.5rem; }
        
        .video-box {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #111;
            border: none;
        }
        
        .player-details { padding: 16px; overflow-y: auto; flex: 1; }
        .player-details p { color: var(--text-gray); margin-top: 8px; line-height: 1.4; font-size: 0.9rem; }

        /* --- SECCIÓN DE TEMPORADAS Y EPISODIOS --- */
        .episodes-section {
            margin-top: 20px;
            display: none;
        }
        .season-selector {
            background-color: var(--bg-pill);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            margin-bottom: 12px;
            width: auto;
        }
        .episodes-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .episode-row {
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            gap: 12px;
            transition: background 0.2s;
        }
        .episode-row:hover, .episode-row.playing {
            background-color: rgba(229, 9, 20, 0.15);
            border: 1px solid rgba(229, 9, 20, 0.3);
        }
        .episode-row i {
            font-size: 1.2rem;
            color: var(--accent-red);
        }
        .episode-info {
            display: flex;
            flex-direction: column;
        }
        .episode-title {
            font-size: 0.88rem;
            font-weight: 600;
        }
        .episode-duration {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 2px;
        }

        /* VISTA EXPLORAR */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            padding: 16px;
        }

        /* --- BARRA FLOTANTE INFERIOR --- */
        .bottom-nav-container {
            position: fixed;
            bottom: 20px; left: 0; right: 0;
            display: flex; justify-content: center;
            z-index: 1000; padding: 0 24px;
        }
        .bottom-nav {
            background: rgba(22, 22, 26, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%; max-width: 400px; height: 66px;
            border-radius: 30px; display: flex;
            justify-content: space-around; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-gray); text-decoration: none;
            font-size: 0.7rem; font-weight: 500; gap: 4px; width: 65px;
        }
        .nav-item i { font-size: 1.35rem; }
        .nav-item.active { color: var(--text-white); }
        .nav-item.active .icon-wrapper {
            background-color: rgba(229, 9, 20, 0.2);
            padding: 4px 16px; border-radius: 16px; color: var(--accent-red);
        }
    </style>
</head>
<body>

    <div class="search-container-box" id="searchBox">
        <div class="search-input-wrapper">
            <i class="ri-search-line"></i>
            <input type="text" id="searchInput" placeholder="Buscar por título, género, año..." oninput="perfectSearch(this.value)">
            <button class="clear-search-btn" id="clearSearch" onclick="clearSearchField()"><i class="ri-close-circle-fill"></i></button>
        </div>
    </div>

    <div id="homePage" class="page-view active-view">
        
        <a href="mailto:cinemaxsoporte@gmail.com?subject=Solicitud%20de%20Contenido%20-%20StreamApp&body=Hola,%20me%20gustar%C3%ADa%20solicitar%20el%20siguiente%20t%C3%ADtulo:%20" class="top-request-bar">
            <span>¿No la encuentras? <strong>Solicitar Película o Serie</strong></span>
            <i class="ri-arrow-right-s-line"></i>
        </a>

        <div class="quick-actions">
            <button class="pill-btn" id="btnFavs" onclick="toggleQuickFilter('favs')"><i class="ri-heart-fill"></i> Mis Favoritos</button>
            <button class="pill-btn" id="btnHist" onclick="toggleQuickFilter('history')"><i class="ri-history-line"></i> Mi Historial</button>
            <button class="search-icon-btn" onclick="toggleSearchBar()"><i class="ri-search-line"></i></button>
        </div>

        <div class="hero-container" id="heroRegion"></div>

        <div id="dynamicSections">
            <div class="section-container">
                <div class="section-title-bar"><h2>Top 10 Más Visto Hoy</h2></div>
                <div class="horizontal-scroll" id="scrollTop10" style="padding-top: 10px; padding-bottom: 15px;"></div>
            </div>

            <div class="section-container">
                <div class="section-title-bar">
                    <h2>Películas Recientes</h2>
                    <button class="btn-view-more" onclick="seeAll('movie')">Ver más</button>
                </div>
                <div class="horizontal-scroll" id="scrollMovies"></div>
            </div>

            <div class="section-container">
                <div class="section-title-bar"><h2>Acción y Adrenalina</h2></div>
                <div class="horizontal-scroll" id="scrollAction"></div>
            </div>

            <div class="section-container">
                <div class="section-title-bar">
                    <h2>Series Imperdibles</h2>
                    <button class="btn-view-more" onclick="seeAll('series')">Ver más</button>
                </div>
                <div class="horizontal-scroll" id="scrollSeries"></div>
            </div>
        </div>
    </div>

    <div id="explorePage" class="page-view">
        <div class="section-title-bar" style="padding: 20px 16px 0 16px;">
            <h2 id="exploreTitle">Explorar Contenido</h2>
            <button class="btn-view-more" onclick="goHome()">Volver</button>
        </div>
        <div class="grid-view" id="exploreGrid"></div>
    </div>

    <div class="player-modal" id="playerModal">
        <div class="player-header">
            <i class="ri-arrow-left-line" onclick="closePlayer()"></i>
            <span id="playerMovieTitle">Reproduciendo</span>
        </div>
        
        <iframe class="video-box" id="videoPlayer" allowfullscreen allow="autoplay"></iframe>
        
        <div class="player-details">
            <h2 id="playerFullTitle">Título Completo</h2>
            <div class="hero-meta" id="playerMeta" style="margin: 10px 0;"></div>
            <p id="playerDesc">Sinopsis detallada.</p>

            <div class="episodes-section" id="episodesArea">
                <select class="season-selector" id="seasonDropdown" onchange="changeSeason()"></select>
                <div class="episodes-list" id="episodesContainer"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav-container">
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" id="navHome" onclick="navigate('home')">
                <div class="icon-wrapper"><i class="ri-home-5-fill"></i></div><span>Inicio</span>
            </a>
            <a href="#" class="nav-item" id="navSearch" onclick="navigate('search')">
                <div class="icon-wrapper"><i class="ri-search-line"></i></div><span>Buscar</span>
            </a>
            <a href="#" class="nav-item" id="navMovies" onclick="navigate('movies')">
                <div class="icon-wrapper"><i class="ri-clapperboard-line"></i></div><span>Películas</span>
            </a>
            <a href="#" class="nav-item" id="navSeries" onclick="navigate('series')">
                <div class="icon-wrapper"><i class="ri-slideshow-3-line"></i></div><span>Series</span>
            </a>
        </nav>
    </div>

    <script>
        // BASE DE DATOS ESTRUCTURADA
        const db = [
            { 
                id: 1, title: "Caramelo", year: 2025, duration: "1h 40m", rating: "8.7", genre: "Comedia", type: "movie", 
                desc: "Una divertida e inesperada aventura familiar donde las travesuras de una mascota cambian la vida de todos.", 
                img: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=1974&auto=format&fit=crop", 
                videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1", isTop: true, topRank: 1 
            },
            { 
                id: 5, title: "The Last of Us", year: 2023, duration: "2 Temporadas", rating: "9.2", genre: "Drama / Sci-Fi / Acción", type: "series", 
                desc: "Veinte años después de la destrucción de la civilización moderna, Joel debe escoltar a Ellie por un mundo hostil.", 
                img: "https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=2070&auto=format&fit=crop", 
                isTop: true, topRank: 2,
                seasons: {
                    "Temporada 1": [
                        { chapter: 1, title: "Cuando estés perdido en la oscuridad", duration: "1h 21m", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" },
                        { chapter: 2, title: "Infectados", duration: "52m", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" },
                        { chapter: 3, title: "Mucho, mucho tiempo", duration: "1h 15m", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" }
                    ],
                    "Temporada 2": [
                        { chapter: 1, title: "Regreso a Jackson", duration: "58m", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" },
                        { chapter: 2, title: "La confrontación", duration: "1h 02m", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" }
                    ]
                }
            },
            { 
                id: 6, title: "El Reino", year: 2024, duration: "1 Temporada", rating: "7.8", genre: "Thriller / Suspenso", type: "series", 
                desc: "Un líder religioso se convierte en el favorito a la presidencia tras un crimen misterioso.", 
                img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1894&auto=format&fit=crop", 
                isTop: true, topRank: 3,
                seasons: {
                    "Temporada 1": [
                        { chapter: 1, title: "El Compromiso", duration: "48m", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" },
                        { chapter: 2, title: "Un dios de ceniza", duration: "50m", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" }
                    ]
                }
            },
            { 
                id: 2, title: "Enola Holmes 3", year: 2026, duration: "2h 05m", rating: "8.1", genre: "Acción / Misterio", type: "movie", 
                desc: "Enola regresa para descifrar un enigma de proporciones internacionales.", 
                img: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2070&auto=format&fit=crop", 
                videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1", isTop: false 
            }
        ];

        let favorites = [1]; // Inicializado con un ID válido actual de la db
        let history = []; 
        let currentHeroIndex = 0; 
        let activeQuickFilter = null; 
        let heroInterval = null;
        let selectedSerie = null; 

        window.addEventListener('DOMContentLoaded', () => {
            renderHero(); renderAllCarousels(); startAutoSlider();
        });

        function renderHero() {
            const current = db[currentHeroIndex];
            const container = document.getElementById('heroRegion');
            if(!container) return;
            container.innerHTML = `
                <div class="hero-card" style="background-image: linear-gradient(to top, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0.2) 60%), url('${current.img}');" onclick="launchPlayer(${current.id})">
                    <span class="badge-movie">${current.type === 'movie' ? 'Película' : 'Serie'}</span>
                    <h1>${current.title}</h1>
                    <div class="hero-meta"><span>${current.genre}</span><span>•</span><span>${current.year}</span></div>
                </div>
                <div class="slider-dots">
                    ${db.slice(0, 3).map((_, idx) => `<div class="dot ${idx === currentHeroIndex ? 'active' : ''}" onclick="manualHeroChange(${idx})"></div>`).join('')}
                </div>
            `;
        }

        function startAutoSlider() { heroInterval = setInterval(() => { currentHeroIndex = (currentHeroIndex + 1) % 3; renderHero(); }, 4000); }
        function manualHeroChange(index) { clearInterval(heroInterval); currentHeroIndex = index; renderHero(); startAutoSlider(); }

        function renderAllCarousels() {
            renderTop10();
            buildCarouselHtml('scrollMovies', db.filter(item => item.type === 'movie'));
            buildCarouselHtml('scrollSeries', db.filter(item => item.type === 'series'));
            buildCarouselHtml('scrollAction', db.filter(item => item.genre.toLowerCase().includes('acción')));
        }

        function renderTop10() {
            const target = document.getElementById('scrollTop10'); if(!target) return;
            const top10Items = db.filter(item => item.isTop).sort((a, b) => a.topRank - b.topRank);
            target.innerHTML = top10Items.map(item => `
                <div class="top10-card" onclick="launchPlayer(${item.id})">
                    <div class="top10-number">${item.topRank}</div>
                    <div class="top10-poster"><img src="${item.img}"></div>
                </div>
            `).join('');
        }

        function buildCarouselHtml(elementId, items) {
            const target = document.getElementById(elementId); if(!target) return;
            target.innerHTML = items.map(item => {
                const isFav = favorites.includes(item.id) ? 'is-fav' : '';
                return `
                    <div class="movie-poster-card">
                        <button class="fav-toast-btn ${isFav}" onclick="event.stopPropagation(); toggleFavorite(${item.id})"><i class="ri-heart-fill"></i></button>
                        <div class="poster-wrapper" onclick="launchPlayer(${item.id})"><img src="${item.img}"></div>
                    </div>
                `;
            }).join('');
        }

        function launchPlayer(id) {
            const target = db.find(item => item.id === id); if(!target) return;
            
            // Registrar historial dinámicamente evitando duplicados
            if(!history.includes(id)) {
                history.unshift(id); // Agregar al inicio para ver lo más reciente primero
            }

            document.getElementById('playerMovieTitle').textContent = target.title;
            document.getElementById('playerFullTitle').textContent = target.title;
            document.getElementById('playerDesc').textContent = target.desc;
            document.getElementById('playerMeta').innerHTML = `<span>${target.genre}</span><span>•</span><span>${target.year}</span><span>•</span><span><i class="ri-star-fill" style="color:#ffc107"></i> ${target.rating}</span>`;
            
            const episodesArea = document.getElementById('episodesArea');

            if(target.type === 'series') {
                selectedSerie = target;
                episodesArea.style.display = "block";
                
                const dropdown = document.getElementById('seasonDropdown');
                const seasonsAvailable = Object.keys(target.seasons);
                dropdown.innerHTML = seasonsAvailable.map(s => `<option value="${s}">${s}</option>`).join('');
                
                const firstSeason = seasonsAvailable[0];
                const firstEpisode = target.seasons[firstSeason][0];
                
                changeSeason(firstSeason);
                playEpisode(firstEpisode.videoUrl, firstEpisode.title, 1);
            } else {
                selectedSerie = null;
                episodesArea.style.display = "none";
                document.getElementById('videoPlayer').src = target.videoUrl;
            }
            
            document.getElementById('playerModal').classList.add('open');
            
            // Actualiza la vista en segundo plano si estás parado sobre la pestaña de historial
            if(activeQuickFilter === 'history') updateQuickFilterView();
        }

        function changeSeason(forcedSeason = null) {
            if(!selectedSerie) return;
            const dropdown = document.getElementById('seasonDropdown');
            const targetSeason = forcedSeason || dropdown.value;
            
            const container = document.getElementById('episodesContainer');
            const episodes = selectedSerie.seasons[targetSeason];

            container.innerHTML = episodes.map(ep => `
                <div class="episode-row" id="epRow-${ep.chapter}" onclick="playEpisode('${ep.videoUrl}', '${ep.title}', ${ep.chapter})">
                    <i class="ri-play-circle-fill"></i>
                    <div class="episode-info">
                        <span class="episode-title">Eps ${ep.chapter}: ${ep.title}</span>
                        <span class="episode-duration">${ep.duration}</span>
                    </div>
                </div>
            `).join('');
        }

        function playEpisode(url, title, chapterNum) {
            document.getElementById('videoPlayer').src = url;
            document.getElementById('playerMovieTitle').textContent = `Reproduciendo: Cap. ${chapterNum}`;
            
            document.querySelectorAll('.episode-row').forEach(row => row.classList.remove('playing'));
            const activeRow = document.getElementById(`epRow-${chapterNum}`);
            if(activeRow) activeRow.classList.add('playing');
        }

        function closePlayer() {
            document.getElementById('playerModal').classList.remove('open');
            document.getElementById('videoPlayer').src = "";
        }

        function toggleFavorite(id) {
            favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
            renderAllCarousels();
            // Actualiza la cuadrícula de inmediato si estás viendo tus favoritos
            if(activeQuickFilter === 'favs') updateQuickFilterView();
        }

        // CONTROL DE FILTROS RÁPIDOS COMPLEMENTADO Y REPARADO
        function toggleQuickFilter(type) {
            const btnFavs = document.getElementById('btnFavs');
            const btnHist = document.getElementById('btnHist');

            if (activeQuickFilter === type) {
                activeQuickFilter = null;
                btnFavs.classList.remove('active-pill');
                btnHist.classList.remove('active-pill');
                goHome();
            } else {
                activeQuickFilter = type;
                document.getElementById('homePage').classList.remove('active-view');
                document.getElementById('explorePage').classList.add('active-view');

                if(type === 'favs') {
                    btnFavs.classList.add('active-pill');
                    btnHist.classList.remove('active-pill');
                } else {
                    btnHist.classList.add('active-pill');
                    btnFavs.classList.remove('active-pill');
                }
                updateQuickFilterView();
            }
        }

        function updateQuickFilterView() {
            if (activeQuickFilter === 'favs') {
                const data = db.filter(item => favorites.includes(item.id));
                displayGridData(data, "Mis Favoritos");
            } else if (activeQuickFilter === 'history') {
                const data = history.map(histId => db.find(item => item.id === histId)).filter(Boolean);
                displayGridData(data, "Mi Historial");
            }
        }

        function toggleSearchBar() {
            const box = document.getElementById('searchBox'); box.classList.toggle('show');
            if (box.classList.contains('show')) document.getElementById('searchInput').focus();
        }

        function perfectSearch(query) {
            if(!query.trim()) { document.getElementById('clearSearch').style.display = "none"; goHome(); return; }
            document.getElementById('clearSearch').style.display = "block";
            const clean = query.toLowerCase().trim();
            const results = db.filter(i => i.title.toLowerCase().includes(clean) || i.genre.toLowerCase().includes(clean));
            document.getElementById('homePage').classList.remove('active-view');
            document.getElementById('explorePage').classList.add('active-view');
            displayGridData(results, `Resultados para: "${query}"`);
        }

        function clearSearchField() { document.getElementById('searchInput').value = ""; document.getElementById('clearSearch').style.display = "none"; goHome(); }

        function displayGridData(items, title) {
            document.getElementById('exploreTitle').textContent = title;
            const grid = document.getElementById('exploreGrid');
            if(items.length === 0) { grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding:40px; color: var(--text-gray);">Está vacío por ahora.</p>`; return; }
            grid.innerHTML = items.map(item => `<div class="movie-poster-card" onclick="launchPlayer(${item.id})"><div class="poster-wrapper"><img src="${item.img}"></div></div>`).join('');
        }

        function goHome() { 
            document.getElementById('explorePage').classList.remove('active-view'); 
            document.getElementById('homePage').classList.add('active-view'); 
            if(!activeQuickFilter) {
                document.getElementById('btnFavs').classList.remove('active-pill');
                document.getElementById('btnHist').classList.remove('active-pill');
            }
        }
        function seeAll(type) { 
            activeQuickFilter = null;
            document.getElementById('btnFavs').classList.remove('active-pill');
            document.getElementById('btnHist').classList.remove('active-pill');
            displayGridData(db.filter(i => i.type === type), type === 'movie' ? "Películas" : "Series"); 
            document.getElementById('homePage').classList.remove('active-view'); 
            document.getElementById('explorePage').classList.add('active-view'); 
        }

        function navigate(tab) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(tab === 'home') { document.getElementById('navHome').classList.add('active'); goHome(); }
            else if(tab === 'movies') { seeAll('movie'); document.getElementById('navMovies').classList.add('active'); }
            else if(tab === 'series') { seeAll('series'); document.getElementById('navSeries').classList.add('active'); }
            else if(tab === 'search') { toggleSearchBar(); document.getElementById('navSearch').classList.add('active'); }
        }
    </script>
</body>
</html>
